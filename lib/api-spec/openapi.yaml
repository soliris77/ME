openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Wealthsimple Market Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quotes
    description: Real-time market quotes
  - name: watchlist
    description: User watchlist management
  - name: alerts
    description: Price alert management
  - name: notifications
    description: In-app notification history (centre de notifications)
  - name: market
    description: Market overview and summaries
  - name: learn
    description: Apprendre à trader progress tracking
  - name: notes
    description: Personal candle annotations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /quotes:
    get:
      operationId: getQuotes
      tags: [quotes]
      summary: Get real-time quotes for multiple symbols
      parameters:
        - name: symbols
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated list of ticker symbols
      responses:
        "200":
          description: Quote data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"

  /quotes/{symbol}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get real-time quote for a single symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quote data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Symbol not found

  /quotes/{symbol}/history/{range}:
    get:
      operationId: getQuoteHistory
      tags: [quotes]
      summary: Get historical price data for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: path
          required: true
          schema:
            type: string
            enum: [1d, 5d, 1mo, 3mo, 6mo, 1y]
      responses:
        "200":
          description: Historical price data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoricalPoint"

  /market/overview:
    get:
      operationId: getMarketOverview
      tags: [market]
      summary: Get overview of major indices and trending assets
      responses:
        "200":
          description: Market overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverview"

  /market/search:
    get:
      operationId: searchSymbols
      tags: [market]
      summary: Search for ticker symbols
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"

  /market/news:
    get:
      operationId: getMarketNews
      tags: [market]
      summary: Get market-moving news (free — Yahoo Finance + Google News RSS, no API key)
      parameters:
        - name: tickers
          in: query
          required: false
          description: Comma-separated ticker symbols to include ticker-specific news for
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: News journal items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
  /watchlist:
    get:
      operationId: getWatchlist
      tags: [watchlist]
      summary: Get all watchlist items
      responses:
        "200":
          description: Watchlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add a symbol to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"

  /watchlist/{id}:
    patch:
      operationId: updateWatchlistItem
      tags: [watchlist]
      summary: Move a watchlist item to another custom list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listName]
              properties:
                listName:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove a symbol from the watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /watchlist/lists:
    post:
      operationId: createWatchlistList
      tags: [watchlist]
      summary: Create a new empty watchlist list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistList"
        "409":
          description: List already exists
    get:
      operationId: getWatchlistLists
      tags: [watchlist]
      summary: Get all watchlist lists in display order
      responses:
        "200":
          description: Ordered lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistList"

  /watchlist/lists/order:
    put:
      operationId: reorderWatchlistLists
      tags: [watchlist]
      summary: Persist the display order of watchlist lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: New ordered lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistList"

  /watchlist/lists/rename:
    patch:
      operationId: renameWatchlistList
      tags: [watchlist]
      summary: Rename a watchlist list for all its items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldName, newName]
              properties:
                oldName:
                  type: string
                newName:
                  type: string
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name:
                    type: string

  /watchlist/lists/{name}:
    delete:
      operationId: deleteWatchlistList
      tags: [watchlist]
      summary: Delete an empty watchlist list
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "409":
          description: List is not empty

  /notes:
    get:
      operationId: getNotes
      tags: [notes]
      summary: Get chart notes for a symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notes for the symbol
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartNote"
    post:
      operationId: addNote
      tags: [notes]
      summary: Add a note to a candle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartNote"

  /notes/{id}:
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a chart note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /learn-progress:
    get:
      operationId: getLearnProgress
      tags: [learn]
      summary: Get progress for all "Apprendre à trader" sections
      responses:
        "200":
          description: Section progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearnProgress"

  /learn-progress/{sectionId}:
    put:
      operationId: updateLearnProgress
      tags: [learn]
      summary: Mark a "Apprendre à trader" section (and optional quiz result) as completed or not
      parameters:
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearnProgressInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnProgress"

  /learn-practice:
    get:
      operationId: getPracticeStatuses
      tags: [learn]
      summary: Server-verified status of each guided-course practice exercise
      responses:
        "200":
          description: One status per lesson slug
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeStatus"

  /learn-practice/events:
    post:
      operationId: recordPracticeEvent
      tags: [learn]
      summary: Record real usage of a client-only tool (calculator, correlation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeEventInput"
      responses:
        "204":
          description: Recorded

  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: Get all price alerts
      responses:
        "200":
          description: Price alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create a price alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete a price alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /alerts/{id}/triggered:
    get:
      operationId: getTriggeredAlerts
      tags: [alerts]
      summary: Get recently triggered alerts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Triggered alert info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Chronological history of sent notifications (most recent first)
      responses:
        "200":
          description: Notification history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationEntry"

  /notifications/unread-count:
    get:
      operationId: getNotificationsUnreadCount
      tags: [notifications]
      summary: Number of unread notifications (sidebar badge)
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsUnreadCount"

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark every notification as read
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Quote:
      type: object
      required: [symbol, name, price, change, changePercent, currency, type]
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        change:
          type: number
        changePercent:
          type: number
        previousClose:
          type: ["number", "null"]
        open:
          type: ["number", "null"]
        high:
          type: ["number", "null"]
        low:
          type: ["number", "null"]
        volume:
          type: ["integer", "null"]
        marketCap:
          type: ["number", "null"]
        currency:
          type: string
        type:
          type: string
          enum: [stock, etf, crypto, index]
        exchange:
          type: ["string", "null"]
        lastUpdated:
          type: string

    HistoricalPoint:
      type: object
      required: [date, close]
      properties:
        date:
          type: string
        open:
          type: ["number", "null"]
        high:
          type: ["number", "null"]
        low:
          type: ["number", "null"]
        close:
          type: number
        volume:
          type: ["integer", "null"]

    MarketOverview:
      type: object
      required: [indices, topGainers, topLosers, wealthsimplePopular]
      properties:
        indices:
          type: array
          items:
            $ref: "#/components/schemas/Quote"
        topGainers:
          type: array
          items:
            $ref: "#/components/schemas/Quote"
        topLosers:
          type: array
          items:
            $ref: "#/components/schemas/Quote"
        wealthsimplePopular:
          type: array
          items:
            $ref: "#/components/schemas/Quote"

    SearchResult:
      type: object
      required: [symbol, name, type, exchange]
      properties:
        symbol:
          type: string
        name:
          type: string
        type:
          type: string
        exchange:
          type: string

    NewsSentimentLabel:
      type: string
      enum: [haussier, baissier, neutre]

    NewsTickerSentiment:
      type: object
      required: [ticker, relevanceScore, sentimentScore, sentimentLabel]
      properties:
        ticker:
          type: string
        relevanceScore:
          type: number
        sentimentScore:
          type: number
        sentimentLabel:
          $ref: "#/components/schemas/NewsSentimentLabel"

    NewsItem:
      type: object
      required: [id, title, summary, source, url, publishedAt, theme, overallSentimentScore, overallSentimentLabel, tickers]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        source:
          type: string
        url:
          type: string
        publishedAt:
          type: string
        theme:
          type: string
        overallSentimentScore:
          type: number
        overallSentimentLabel:
          $ref: "#/components/schemas/NewsSentimentLabel"
        tickers:
          type: array
          items:
            $ref: "#/components/schemas/NewsTickerSentiment"

    WatchlistItem:
      type: object
      required: [id, symbol, name, addedAt, listName]
      properties:
        id:
          type: integer
        symbol:
          type: string
        name:
          type: string
        note:
          type: ["string", "null"]
        listName:
          type: string
        addedAt:
          type: string

    WatchlistList:
      type: object
      required: [name, position]
      properties:
        name:
          type: string
        position:
          type: integer

    WatchlistInput:
      type: object
      required: [symbol, name]
      properties:
        symbol:
          type: string
        name:
          type: string
        listName:
          type: string
        note:
          type: string

    ChartNote:
      type: object
      required: [id, symbol, candleDate, text, createdAt]
      properties:
        id:
          type: integer
        symbol:
          type: string
        candleDate:
          type: string
        text:
          type: string
        createdAt:
          type: string

    ChartNoteInput:
      type: object
      required: [symbol, candleDate, text]
      properties:
        symbol:
          type: string
        candleDate:
          type: string
        text:
          type: string

    LearnProgress:
      type: object
      required: [sectionId, completed, updatedAt]
      properties:
        sectionId:
          type: string
        completed:
          type: boolean
        quizScore:
          type: ["integer", "null"]
        quizTotal:
          type: ["integer", "null"]
        completedAt:
          type: ["string", "null"]
        updatedAt:
          type: string

    LearnProgressInput:
      type: object
      required: [completed]
      properties:
        completed:
          type: boolean
        quizScore:
          type: integer
        quizTotal:
          type: integer

    PracticeStatus:
      type: object
      required: [slug, done, criteria, detail]
      properties:
        slug:
          type: string
        done:
          type: boolean
        criteria:
          type: string
        detail:
          type: string

    PracticeEventInput:
      type: object
      required: [tool]
      properties:
        tool:
          type: string
          enum: [calculator, calculator-rr, correlation]

    Alert:
      type: object
      required: [id, symbol, alertType, active, createdAt]
      properties:
        id:
          type: integer
        symbol:
          type: string
        name:
          type: ["string", "null"]
        alertType:
          type: string
          enum: [price, pattern, signal]
        condition:
          type: ["string", "null"]
          enum: [above, below, null]
        targetPrice:
          type: ["number", "null"]
        patternSignal:
          type: ["string", "null"]
          enum: [haussier, baissier, null]
        minStrength:
          type: ["string", "null"]
          enum: [faible, moyen, fort, null]
        active:
          type: boolean
        notifyEmail:
          type: ["string", "null"]
        notifyPhone:
          type: ["string", "null"]
        triggeredAt:
          type: ["string", "null"]
        createdAt:
          type: string

    NotificationEntry:
      type: object
      required: [id, symbol, alertType, title, body, channels, sentAt]
      properties:
        id:
          type: integer
        alertId:
          type: ["integer", "null"]
        symbol:
          type: string
        name:
          type: ["string", "null"]
        alertType:
          type: string
          enum: [price, pattern, signal]
        title:
          type: string
        body:
          type: string
        channels:
          type: array
          items:
            type: string
        sentAt:
          type: string
        readAt:
          type: ["string", "null"]

    NotificationsUnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    AlertInput:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string
        name:
          type: string
        alertType:
          type: string
          enum: [price, pattern, signal]
        condition:
          type: string
          enum: [above, below]
        targetPrice:
          type: number
        patternSignal:
          type: string
          enum: [haussier, baissier]
        minStrength:
          type: string
          enum: [faible, moyen, fort]
        notifyEmail:
          type: string
        notifyPhone:
          type: string
