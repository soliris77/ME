kind = "web"
previewPath = "/"
title = "Wealthsimple Market Tracker"
version = "1.0.0"
id = "artifacts/wealthsimple-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23051

[services.development]
run = "pnpm --filter @workspace/wealthsimple-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wealthsimple-tracker", "run", "build" ]
publicDir = "artifacts/wealthsimple-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23051"
BASE_PATH = "/"
